<form class="buscador" method="get" role="search">
    {% if estado_actual %}<input type="hidden" name="estado" value="{{ estado_actual }}">{% endif %}
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="search" name="q" value="{{ busqueda }}"
           placeholder="{{ texto_buscador|default:'Buscar' }}" aria-label="Buscar">
    <button type="submit" class="buscador__boton">Buscar</button>
</form>
