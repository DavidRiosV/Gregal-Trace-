{% extends "gestion/principal.html" %}
{% load static %}

{% block titulo %}Inicio · Gregal Trace{% endblock %}

{% block contenido %}
<h1 class="titulo-pantalla">Hola, {{ user.first_name|default:user.username }}</h1>

<div class="categorias">
    {% for slug, tipo in tipos.items %}
        <a class="categoria" href="{% url 'lista_proyectos' slug %}">
            <h2 class="categoria__titulo">{{ tipo.titulo }}</h2>
            <div class="categoria__imagen">
                <img src="{% static tipo.imagen %}" alt="">
            </div>
        </a>
    {% endfor %}

    <a class="categoria categoria--urgencia" href="{% url 'urgencias' %}">
        <h2 class="categoria__titulo">Urgencias</h2>
        <div class="categoria__imagen">
            <img src="{% static 'img/categorias/urgencias.jpg' %}" alt="">
        </div>
    </a>
</div>
{% endblock %}
