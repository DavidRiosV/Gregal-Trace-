{% load static %}
<header class="barra-superior">
    <a class="barra-superior__marca" href="{% url 'index' %}">
        <img src="{% static 'img/logo.png' %}" alt="" width="32" height="32">
        <span>Gregal Trace</span>
    </a>
    <div class="barra-superior__usuario">
        <span class="avatar avatar--claro" aria-hidden="true">{{ user.first_name|default:user.username|slice:":1"|upper }}</span>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="boton-icono boton-icono--claro" aria-label="Cerrar sesión">
                {% include "gestion/icono.html" with nombre="salir" %}
            </button>
        </form>
    </div>
</header>
